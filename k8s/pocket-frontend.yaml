apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: registry.kb/passwd-pocket-frontend
        env:
          - name: VITE_BACKEND_URL
            value: "https://api.pocket.kb"
        ports:
          - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-srv
  namespace: pocket
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-ingress
  namespace: pocket
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - pocket.kb
    secretName: pocket-tls
  rules:
  - host: pocket.kb
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-srv
              port:
                number: 80
